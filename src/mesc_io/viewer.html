<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>mesc-io view</title>
<style>
  /* Dark, and calm. Calm is not a colour: it is how little sits on the screen at once.
     The image is the centre and gets the room; the unit list is navigation; the instruments
     are the working panel; the traces get the whole width because time is horizontal.
     Layout drawn by hand on 2026-09-18 — docs/viewer_design.md. */
  :root {
    --bg:#121417; --panel:#181b1f; --panel-2:#1e2228; --line:#2a2f36;
    --ink:#e6e8ea; --muted:#8b939c; --faint:#5d656e; --sel:#232a33;
    --accent:#4ea3dd; --warn:#e0a33a; --bad:#e05a5a;
  }
  * { box-sizing:border-box }
  html, body { height:100%; margin:0 }
  body { font:13px/1.4 -apple-system, "Segoe UI", system-ui, sans-serif; color:var(--ink);
         background:var(--bg); overflow:hidden }
  #wrap { display:grid; height:100vh;
          grid-template-columns:230px 1fr 260px;
          grid-template-rows:1fr var(--traces-h, 260px);
          grid-template-areas:"units image tools" "traces traces traces" }
  h1 { font-size:13px; font-weight:600; margin:0; padding:10px 12px 6px; color:var(--muted);
       letter-spacing:.02em; text-transform:lowercase }
  h1 small { display:block; color:var(--ink); font-weight:400; font-size:12px; margin-top:2px;
             white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
  h2 { font-size:11px; font-weight:600; margin:14px 12px 6px; color:var(--muted);
       text-transform:uppercase; letter-spacing:.06em }
  button { font:inherit; padding:4px 10px; border:1px solid var(--line); background:var(--panel-2);
           color:var(--ink); border-radius:5px; cursor:pointer }
  button:hover { border-color:var(--accent) }
  button.on { border-color:var(--accent); color:var(--accent) }
  button:disabled { opacity:.35; cursor:default }
  input, select { font:inherit; color:var(--ink); background:var(--panel-2);
                  border:1px solid var(--line); border-radius:4px; padding:3px 6px }
  input[type=range] { accent-color:var(--accent); padding:0; background:none; border:none }
  .hint { color:var(--muted); font-size:11px }
  .faint { color:var(--faint) }

  /* ---- units (left) ---- */
  #unitsCol { grid-area:units; display:flex; flex-direction:column; min-height:0;
              background:var(--panel); border-right:1px solid var(--line) }
  #units { flex:1 1 auto; overflow-y:auto; min-height:120px }
  .u { display:grid; grid-template-columns:44px 1fr; gap:8px; align-items:center;
       padding:6px 10px; cursor:pointer; border-bottom:1px solid var(--line) }
  .u:hover { background:var(--panel-2) }
  .u.on { background:var(--sel); box-shadow:inset 3px 0 0 var(--accent) }
  .u img { width:44px; height:44px; object-fit:cover; border-radius:3px; background:#000 }
  .u b { display:block; font-weight:600; font-size:12px }
  .u span { display:block; color:var(--muted); font-size:11px }
  .u i { display:block; color:var(--faint); font-size:11px; font-style:normal;
         white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
  #meta { flex:0 0 var(--meta-h, 300px); overflow-y:auto; border-top:1px solid var(--line); min-height:0 }
  #metaSplit { height:4px; cursor:row-resize; background:transparent; margin-bottom:-4px; position:relative; z-index:1 }
  #metaSplit:hover { background:var(--accent) }
  #meta table { width:100%; border-collapse:collapse; font-size:11.5px }
  #meta td { padding:3px 12px; vertical-align:top }
  #meta td:first-child { color:var(--muted); width:74px; white-space:nowrap }
  .finding { margin:6px 12px; padding:6px 8px; border-radius:4px; font-size:11px;
             background:var(--panel-2); border-left:3px solid var(--warn) }
  .finding.error { border-left-color:var(--bad) }

  /* ---- image (centre) ---- */
  #imageCol { grid-area:image; display:flex; flex-direction:column; min-width:0; min-height:0 }
  #stage { flex:1; position:relative; overflow:hidden; background:#000; cursor:crosshair }
  #traceRubber { position:absolute; border:1px dashed var(--accent); background:rgba(78,163,221,.12);
                 display:none; pointer-events:none }
  #view { position:absolute; left:0; top:0; image-rendering:pixelated; transform-origin:0 0 }
  #rubber { position:absolute; border:1px dashed var(--accent); background:rgba(78,163,221,.12);
            display:none; pointer-events:none }
  #player { display:flex; align-items:center; gap:10px; padding:6px 12px; background:var(--panel);
            border-top:1px solid var(--line) }
  #player input[type=range] { flex:1 }
  #frameLbl { min-width:150px; text-align:right; font-variant-numeric:tabular-nums }
  #chans button { padding:2px 8px; font-size:11px }
  .readout { position:absolute; left:8px; top:8px; font-size:11px; color:var(--ink); font-variant-numeric:tabular-nums;
             background:rgba(18,20,23,.8); padding:3px 7px; border-radius:3px; pointer-events:none; display:none;
             border:1px solid var(--line); white-space:nowrap }
  .readout b { color:var(--accent); font-weight:600 }
  #stageHint { position:absolute; right:8px; bottom:8px; font-size:11px; color:var(--muted);
               background:rgba(18,20,23,.7); padding:2px 6px; border-radius:3px; pointer-events:none }

  /* ---- instruments (right) ---- */
  #toolsCol { grid-area:tools; display:flex; flex-direction:column; min-height:0;
              background:var(--panel); border-left:1px solid var(--line) }
  .instr { display:flex; gap:6px; padding:0 12px; flex-wrap:wrap }
  .instr button { flex:0 0 auto; min-width:40px }
  .stepper { display:inline-flex; align-items:center; border:1px solid var(--line);
             border-radius:5px; overflow:hidden }
  .stepper button { border:none; border-radius:0; padding:4px 8px }
  .stepper span { padding:0 6px 0 8px; color:var(--muted); font-size:11px }
  .stepper input[type=number] { width:54px; border:none; border-left:1px solid var(--line); border-radius:0;
                                text-align:center; font-variant-numeric:tabular-nums; -moz-appearance:textfield }
  .stepper input::-webkit-inner-spin-button { opacity:1 }
  .sizes { align-items:center; font-size:11px; color:var(--muted) }
  .sizes label { display:inline-flex; align-items:center; gap:4px }
  .sizes input[type=number] { width:52px; padding:2px 4px; font-size:11px }
  .sizes span { color:var(--faint) }
  details { margin:8px 12px 0; font-size:12px }
  summary { cursor:pointer; color:var(--muted); user-select:none }
  details .row { display:grid; grid-template-columns:52px 1fr 48px; gap:8px; align-items:center;
                 margin-top:6px; font-size:11px; color:var(--muted) }
  details .row input[type=range] { width:100% }
  #roiFilter { margin:0 12px 6px; width:calc(100% - 24px) }
  #roiList { flex:1; overflow-y:auto; min-height:0; border-top:1px solid var(--line) }
  .r { display:grid; grid-template-columns:16px 10px 1fr auto 18px; gap:6px; align-items:center;
       padding:4px 10px; border-bottom:1px solid var(--line); cursor:pointer }
  .r:hover { background:var(--panel-2) }
  .r.sel { background:var(--sel); box-shadow:inset 3px 0 0 var(--accent) }
  .r .sw { width:10px; height:10px; border-radius:50% }
  .r .nm { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; user-select:none }
  .r input[type=text] { width:100%; padding:1px 4px }
  .r .px { color:var(--faint); font-size:11px; white-space:nowrap }
  .r .x { color:var(--faint); text-align:center } .r .x:hover { color:var(--bad) }
  #exports { display:flex; gap:8px; padding:8px 12px; border-top:1px solid var(--line);
             align-items:center; font-size:11px; flex-wrap:wrap }
  #exports button { font-size:11px; padding:3px 8px }
  #exports a { color:var(--accent); text-decoration:none }
  #saveState { margin-left:auto; color:var(--faint) } #saveState.bad { color:var(--bad) }

  /* ---- traces (bottom) ---- */
  #tracesRow { grid-area:traces; display:flex; flex-direction:column; min-height:0;
               border-top:1px solid var(--line); background:var(--panel) }
  #traceBar { display:flex; align-items:center; gap:8px; padding:5px 12px; font-size:11px }
  #traceBar .grow { flex:1 }
  #traceScroll { flex:1; overflow-y:auto; overflow-x:hidden; min-height:0; position:relative }
  #trace { display:block; width:100%; }
  #traceLbl { color:var(--muted) }
  .ylim { display:inline-flex; align-items:center; gap:4px; color:var(--faint) }
  .ylim input[type=number] { width:64px; padding:2px 4px; font-size:11px; -moz-appearance:textfield }
  .ylim input::-webkit-inner-spin-button { display:none }
  .ylim input.fixed { border-color:var(--accent); color:var(--accent) }
  .ylim button { font-size:11px; padding:2px 6px }
  #splitter { height:4px; cursor:row-resize; background:transparent; margin-top:-4px }
  #splitter:hover { background:var(--accent) }
</style>
</head>
<body>
<div id="wrap">

  <aside id="unitsCol">
    <h1>units <small id="fname">loading…</small></h1>
    <div id="units"></div>
    <div id="metaSplit" title="drag to resize"></div>
    <div id="meta"><h2>metadata</h2><table id="metaTable"></table><div id="findings"></div></div>
  </aside>

  <section id="imageCol">
    <div id="stage">
      <canvas id="view"></canvas>
      <div id="rubber"></div>
      <div id="stageHint">drag a box to zoom · drag an ROI to move it · wheel zooms · double-click resets</div>
      <div id="pixelRead" class="readout"></div>
    </div>
    <div id="player">
      <button id="playBtn" title="space">▶</button>
      <input type="range" id="frame" min="0" max="0" value="0">
      <span id="frameLbl" class="hint">—</span>
      <span id="chans"></span>
    </div>
  </section>

  <aside id="toolsCol">
    <h2>instruments</h2>
    <div class="instr">
      <button id="addRoi" title="add an ROI (click on the image)">+</button>
      <button id="delRoi" title="remove the selected ROI" disabled>−</button>
      <label class="stepper" title="average this many frames around the slider (1 = the raw frame)">
        <span>AVG</span><input type="number" id="avgN" min="1" max="999" step="1" value="1">
      </label>
      <button id="meanBtn" title="the whole recording collapsed into one picture">mean</button>
    </div>
    <div class="instr" style="margin-top:6px">
      <button id="toolSpot" class="on" title="a disc where you click">spot</button>
      <button id="toolRect" title="a rectangle centred where you click">rect</button>
      <button id="toolPoly" title="click the corners, double-click to close">polygon</button>
      <button id="clearAll" title="remove every ROI (asks first)" style="margin-left:auto">clear all</button>
    </div>
    <div class="instr sizes" style="margin-top:6px" id="sizeRow">
      <label id="sizeSpot"><span>r</span><input type="number" id="spotR" min="1" max="200" step="0.5" value="3"> px</label>
      <label id="sizeRect" style="display:none"><span>w</span><input type="number" id="rectW" min="1" max="1000" step="1" value="8"> × <input type="number" id="rectH" min="1" max="1000" step="1" value="8"> px</label>
      <span class="hint" id="sizeWho">for new ROIs</span>
    </div>
    <details>
      <summary>contrast</summary>
      <div class="row"><span>low</span><input type="range" id="lo" min="0" max="20" step="0.5" value="1"><span id="loVal">1 %</span></div>
      <div class="row"><span>high</span><input type="range" id="hi" min="90" max="100" step="0.1" value="99.5"><span id="hiVal">99.5 %</span></div>
    </details>

    <h2>rois <span id="roiCount" class="faint"></span> <span id="roiUnit" class="faint" style="font-weight:400;text-transform:none;letter-spacing:0"></span>
      <select id="copyFrom" style="float:right;font-size:11px;padding:1px 4px;margin-top:-3px;display:none"></select></h2>
    <input id="roiFilter" placeholder="filter by name" type="text">
    <div id="roiList"></div>
    <div id="exports">
      <button id="doTraces" title="one pass over the recording (Enter)">traces ⏎</button>
      <a id="dlCsv" href="#" title="the traces, one column per ROI">csv</a>
      <button id="dlZip" title="the ROI set as an ImageJ zip — Fiji opens it, the pipeline reads it">export ROIs</button>
      <a id="dlJson" href="#" title="the ROI set as stored">json</a>
      <span id="saveState" title="the view and the ROIs save themselves">saved</span>
    </div>
  </aside>

  <section id="tracesRow">
    <div id="splitter" title="drag to resize"></div>
    <div id="traceBar">
      <span id="traceLbl">traces</span>
      <span class="grow"></span>
      <button id="modeStack" class="on" title="one line per ROI, with an offset">stack</button>
      <button id="modeOverlay" title="all on one axis">overlay</button>
      <button id="gridBtn" class="on" title="time and value grid">grid</button>
      <label class="ylim" title="vertical limits in reader units — type them, or leave on auto">
        <span>y</span><input type="number" id="yLo" step="any" placeholder="auto"><span>–</span><input type="number" id="yHi" step="any" placeholder="auto">
        <button id="yAuto" title="back to limits that follow the data">auto</button>
      </label>
      <button id="traceReset" title="whole recording">⤢</button>
      <span class="hint" id="traceHint">drag a box to zoom · double-click resets · ← → slide</span>
    </div>
    <div id="traceScroll"><canvas id="trace"></canvas><div id="traceRubber"></div><div id="traceRead" class="readout"></div></div>
  </section>

</div>

<script>
"use strict";
const $ = id => document.getElementById(id);

/* ------------------------------------------------------------------------------------------
   state — everything the view IS, and therefore everything that is saved. One object, so the
   session file and the screen cannot disagree about what is being looked at. */
const V = {
  unit: null, ch: 0, frame: 0, avg: 1, mean: true, lo: 1, hi: 99.5,
  zoom: { x: 0, y: 0, w: 0, h: 0 },        // in image pixels; w=0 means the whole frame
  traceMode: "stack", grid: true, traceZoom: null,   // [t0, t1] in frames, or null
  valueZoom: null,                          // overlay only: [lo, hi] in reader units, or null
  yFixed: null,                             // typed limits [lo, hi]; apply to every band and the overlay until 'auto'
  sel: -1, shown: {},                      // unit path -> { roi name -> drawn in the trace strip }
  tracesH: 260, metaH: 300,
};
let FILE = null, unit = null, playing = null;
let ROIS = [], tool = "spot", draft = [], TR = null;   // TR = last traces payload
const PALETTE = ["#e74c3c","#2ecc71","#9b59b6","#e67e22","#1abc9c","#3498db",
                 "#f1c40f","#e84393","#7f8c8d","#00cec9"];
const colour = i => PALETTE[i % PALETTE.length];
const fs = () => (unit && unit.frame_rate_hz) || 0;
/* which ROIs are drawn in the trace strip, for the unit on screen */
const shown = () => { if (!unit) return {}; if (typeof V.shown[unit.path] !== "object" || !V.shown[unit.path]) V.shown[unit.path] = {}; return V.shown[unit.path]; };
let ROI_UNITS = {};                        // unit path -> count, for the "copy from" menu

/* ------------------------------------------------------------------------------------------
   the view, saved by itself. Debounced; badge goes red if the server will not take it. */
let saveT = 0;
function saveView() {
  clearTimeout(saveT);
  saveT = setTimeout(async () => {
    try {
      const body = JSON.stringify({ ...V, unit: unit ? unit.path : null, tracesH: V.tracesH });
      const r = await fetch("/api/view", { method: "PUT", headers: { "Content-Type": "application/json" }, body });
      badge(r.ok ? "saved" : "NOT saved", !r.ok);
    } catch (e) { badge("NOT saved", true); }
  }, 300);
}
function badge(text, bad) { const b = $("saveState"); b.textContent = text; b.classList.toggle("bad", !!bad); }

/* ------------------------------------------------------------------------------------------
   units + metadata */
async function boot() {
  FILE = await (await fetch("/api/file")).json();
  $("fname").textContent = FILE.file;
  $("units").innerHTML = FILE.units.map((u, i) => `
    <div class="u" data-i="${i}">
      <img src="/api/thumb/${u.path}/0?lo=1&hi=99.5" alt="">
      <div><b>${u.name}</b><span>${u.frames} fr · ${u.frame_rate_hz ? u.frame_rate_hz.toFixed(1) + " Hz" : "rate ?"}</span>
      <i title="${esc(u.comment)}">${esc(u.comment) || "&nbsp;"}</i></div>
    </div>`).join("");
  $("units").onclick = e => { const d = e.target.closest(".u"); if (d) pick(+d.dataset.i); };
  const saved = (await (await fetch("/api/view")).json()).view || {};
  Object.assign(V, pickKeys(saved, ["ch","frame","avg","mean","lo","hi","zoom","traceMode","grid","traceZoom","valueZoom","yFixed","sel","shown","tracesH","metaH"]));
  applyStatic();
  const idx = Math.max(0, FILE.units.findIndex(u => u.path === saved.unit));
  if (FILE.units.length) pick(idx, true);
}
const esc = s => String(s || "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pickKeys = (o, ks) => Object.fromEntries(ks.filter(k => o[k] !== undefined).map(k => [k, o[k]]));

function applyStatic() {                 // controls that reflect V without a unit
  $("lo").value = V.lo; $("hi").value = V.hi; $("loVal").textContent = V.lo + " %"; $("hiVal").textContent = V.hi + " %";
  $("avgN").value = V.avg;
  $("meanBtn").classList.toggle("on", V.mean);
  $("modeStack").classList.toggle("on", V.traceMode === "stack");
  $("modeOverlay").classList.toggle("on", V.traceMode === "overlay");
  $("gridBtn").classList.toggle("on", V.grid);
  document.documentElement.style.setProperty("--traces-h", V.tracesH + "px");
  document.documentElement.style.setProperty("--meta-h", V.metaH + "px");
}

function pick(i, restoring) {
  if (playing) togglePlay();
  unit = FILE.units[i];
  document.querySelectorAll(".u").forEach((d, k) => d.classList.toggle("on", k === i));
  if (!restoring) { V.ch = 0; V.frame = 0; V.zoom = { x: 0, y: 0, w: 0, h: 0 }; V.traceZoom = null; V.valueZoom = null; TR = null; }
  V.ch = Math.min(V.ch, unit.channels.length - 1);
  $("chans").innerHTML = unit.channels.map((c, k) =>
    `<button class="chan ${k === V.ch ? "on" : ""}" data-c="${k}">${c.replace("Channel_", "ch")}</button>`).join(" ");
  document.querySelectorAll(".chan").forEach(b => b.onclick = () => {
    V.ch = +b.dataset.c; document.querySelectorAll(".chan").forEach(x => x.classList.toggle("on", x === b));
    TR = null; draw(); saveView();
  });
  $("frame").max = unit.frames - 1; $("frame").value = Math.min(V.frame, unit.frames - 1);
  const st = unit.stage_um;
  $("metaTable").innerHTML = [
    ["unit", unit.path],
    ["stage", st ? `x ${fmt(st.x)} · y ${fmt(st.y)} · z ${fmt(st.z)} µm` : "not in file"],
    ["frames", `${unit.frames}`],
    ["size", `${unit.width} × ${unit.height} px`],
    ["rate", unit.frame_rate_hz ? unit.frame_rate_hz.toFixed(3) + " Hz" : "not stated"],
    ["duration", unit.duration_s ? unit.duration_s.toFixed(1) + " s" : "—"],
    ["pixel", unit.pixel_size_um ? unit.pixel_size_um.toFixed(4) + " µm" : "not stated"],
    ["field", unit.pixel_size_um ? (unit.width * unit.pixel_size_um).toFixed(1) + " × " + (unit.height * unit.pixel_size_um).toFixed(1) + " µm" : "—"],
    ["comment", esc(unit.comment) || "—"],
  ].map(([k, v]) => `<tr><td>${k}</td><td>${v}</td></tr>`).join("");
  const mine = FILE.findings.filter(f => !f.units.length || f.units.some(u => unit.path.endsWith(u) || u.endsWith(unit.name)));
  $("findings").innerHTML = mine.map(f => `<div class="finding ${f.level}">${esc(f.message)}</div>`).join("");
  $("roiUnit").textContent = "· " + unit.name;
  if (!restoring) V.sel = -1;
  draw();
  loadRois().then(() => { renderCopyMenu(); plotTraces(); });
  if (!restoring) saveView();
}
const fmt = v => (v == null ? "—" : (Math.round(v * 10) / 10).toString());

/* ------------------------------------------------------------------------------------------
   the image: frames (single or averaged) or the mean, zoomed by a rectangle */
let imgEl = null, imgUrl = "";
function frameUrl() {
  const w = `lo=${V.lo}&hi=${V.hi}`;
  return V.mean ? `/api/mean/${unit.path}/${V.ch}?${w}`
                : `/api/frame/${unit.path}/${V.ch}/${V.frame}?${w}&n=${V.avg}`;
}
function draw() {
  if (!unit) return;
  const url = frameUrl();
  if (url !== imgUrl) {
    imgUrl = url;
    const im = new Image();
    im.onload = () => { if (imgUrl === url) { imgEl = im; paint(); } };
    im.src = url;
  } else paint();
  $("frameLbl").textContent = V.mean ? "mean of the recording"
    : `frame ${V.frame} / ${unit.frames - 1}` + (fs() ? ` · ${(V.frame / fs()).toFixed(2)} s` : "")
      + (V.avg > 1 ? ` · ×${V.avg}` : "");
}
/* The canvas is the stage's size; the zoom rectangle (image px) maps onto it. ROIs are drawn
   in image coordinates through the same mapping, so they stay put under any zoom. */
function mapping() {
  const s = $("stage"), W = s.clientWidth, H = s.clientHeight;
  const z = V.zoom.w ? V.zoom : { x: 0, y: 0, w: unit.width, h: unit.height };
  const k = Math.min(W / z.w, H / z.h);
  const ox = (W - z.w * k) / 2 - z.x * k, oy = (H - z.h * k) / 2 - z.y * k;
  return { k, ox, oy, W, H };
}
function paint() {
  if (!unit) return;
  const c = $("view"), g = c.getContext("2d"), m = mapping();
  c.width = m.W; c.height = m.H;
  g.fillStyle = "#000"; g.fillRect(0, 0, m.W, m.H);
  if (imgEl) { g.imageSmoothingEnabled = false; g.drawImage(imgEl, m.ox, m.oy, unit.width * m.k, unit.height * m.k); }
  overlay(g, m);
}
function overlay(g, m) {
  const P = ([x, y]) => [m.ox + (x + .5) * m.k, m.oy + (y + .5) * m.k];
  g.lineWidth = 1.5;
  ROIS.forEach((r, i) => {
    g.strokeStyle = colour(i); g.beginPath();
    r.points.forEach((p, k) => { const [X, Y] = P(p); k ? g.lineTo(X, Y) : g.moveTo(X, Y); });
    g.closePath(); g.stroke();
    if (i === V.sel) { g.fillStyle = colour(i) + "44"; g.fill(); g.lineWidth = 2.5; g.stroke(); g.lineWidth = 1.5; }
    if (m.k >= 1.5 || i === V.sel) {

  if (!unit) return;
  if (!ROIS.length) { $("traceLbl").textContent = "draw something first"; return; }
  $("traceLbl").textContent = "one pass over the recording…";
  const d = await (await fetch(`/api/traces/${unit.path}/${V.ch}`)).json();
  if (d.error) { $("traceLbl").textContent = d.error; return; }
  TR = d; plotTraces();
};
function visibleTraces() {
  if (!TR) return [];
  return TR.names.map((n, i) => ({ name: n, i, v: TR.traces[i], area: TR.areas_px[i] }))
                 .filter(t => shown()[t.name] !== false);
}
function plotTraces() {
  const c = $("trace"), box = $("traceScroll"), g = c.getContext("2d");
  const dpr = window.devicePixelRatio || 1, W = box.clientWidth;
  const ts = visibleTraces();
  const stack = V.traceMode === "stack";
  const rowH = 64, H = stack ? Math.max(box.clientHeight, ts.length * rowH + 22) : box.clientHeight;
  c.width = W * dpr; c.height = H * dpr; c.style.height = H + "px"; g.scale(dpr, dpr);
  g.clearRect(0, 0, W, H);
  if (!TR) { lastAuto = null; syncYBoxes(); $("traceLbl").textContent = ROIS.length ? "traces — press to compute" : "traces"; g.fillStyle = "#5d656e"; g.font = "12px sans-serif";
             g.fillText(ROIS.length ? "press ‹traces› to read every ROI's time course in one pass" : "draw an ROI on the image, then ‹traces›", 12, 24); return; }
  const n = TR.traces[0].length, [t0, t1] = V.traceZoom || [0, n - 1];
  const L = 54, R = 12, T = 18, B = 18;
  const X = f => L + (f - t0) / Math.max(1, t1 - t0) * (W - L - R);
  $("traceLbl").textContent = `${ts.length} of ${TR.names.length} ROIs · ${n} frames` + (V.traceZoom ? ` · ${t0}–${t1}` : "");
  // grid: seconds when the rate is known, else frames
  if (V.grid) {
    g.strokeStyle = "#262b31"; g.fillStyle = "#6b737c"; g.font = "10px sans-serif"; g.lineWidth = 1;
    const span = t1 - t0, rate = fs() || 1, secs = span / rate;
    const step = niceStep(secs / 8) * rate;              // in frames
    for (let f = Math.ceil(t0 / step) * step; f <= t1; f += step) {
      const x = Math.round(X(f)) + .5; g.beginPath(); g.moveTo(x, T); g.lineTo(x, H - B); g.stroke();
      g.fillText(fs() ? (f / rate).toFixed(secs < 20 ? 1 : 0) + " s" : f + "", x + 3, H - 5);
    }
  }
  // the frame cursor: the slider and the trace strip are the same number
  if (!V.mean) { const x = Math.round(X(V.frame)) + .5; g.strokeStyle = "#4ea3dd"; g.lineWidth = 1; g.beginPath(); g.moveTo(x, T); g.lineTo(x, H - B); g.stroke(); }
  if (stack) {
    lastAuto = ts.length ? limits((ts.find(t => t.i === V.sel) || ts[0]).v.slice(t0, t1 + 1)) : null;
    ts.forEach((t, row) => {
      const y0 = T + row * rowH, band = rowH - 8;
      const seg = t.v.slice(t0, t1 + 1), [lo, hi] = V.yFixed || limits(seg);
      if (V.grid) { g.strokeStyle = "#20252b"; g.beginPath(); g.moveTo(L, y0 + band + .5); g.lineTo(W - R, y0 + band + .5); g.stroke(); }
      g.strokeStyle = colour(t.i); g.lineWidth = t.i === V.sel ? 2.2 : 1.3; g.beginPath();
      g.save(); g.beginPath(); g.rect(L, y0 - 2, W - L - R, band + 4); g.clip(); g.beginPath();
      for (let f = t0; f <= t1; f++) { const y = y0 + band - (t.v[f] - lo) / ((hi - lo) || 1) * band; f === t0 ? g.moveTo(X(f), y) : g.lineTo(X(f), y); }
      g.stroke(); g.restore();
      g.fillStyle = colour(t.i); g.font = (t.i === V.sel ? "bold " : "") + "11px sans-serif";
      g.fillText(t.name, 6, y0 + 12);
      g.fillStyle = "#6b737c"; g.font = "10px sans-serif"; g.fillText(`${lo.toFixed(0)} … ${hi.toFixed(0)}`, 6, y0 + 24);
    });
  } else {
    const all = ts.flatMap(t => t.v.slice(t0, t1 + 1));
    const [lo, hi] = V.yFixed || V.valueZoom || limits(all);
    lastAuto = limits(all);
    const Y = v => T + (H - T - B) - (v - lo) / ((hi - lo) || 1) * (H - T - B);
    if (V.grid) { g.strokeStyle = "#262b31"; g.fillStyle = "#6b737c"; g.font = "10px sans-serif";
      const vs = niceStep((hi - lo) / 5);
      for (let v = Math.ceil(lo / vs) * vs; v <= hi; v += vs) { const y = Math.round(Y(v)) + .5; g.beginPath(); g.moveTo(L, y); g.lineTo(W - R, y); g.stroke(); g.fillText(v.toFixed(0), 4, y + 3); } }
    g.save(); g.beginPath(); g.rect(L, T, W - L - R, H - T - B); g.clip();
    ts.forEach(t => {
      g.strokeStyle = colour(t.i); g.lineWidth = t.i === V.sel ? 2.2 : 1.2; g.globalAlpha = (V.sel < 0 || t.i === V.sel) ? 1 : .55; g.beginPath();
      for (let f = t0; f <= t1; f++) { f === t0 ? g.moveTo(X(f), Y(t.v[f])) : g.lineTo(X(f), Y(t.v[f])); }
      g.stroke(); g.globalAlpha = 1;
    });
    g.restore();
    ts.forEach((t, k) => { g.fillStyle = colour(t.i); g.font = "11px sans-serif"; g.fillText(t.name, L + 6 + k * 70, T - 5); });

}
/* Axis limits adapt to what is on screen: the 1st and 99th percentile of the visible frames,
   padded a little. Min/max let a single odd frame (the black head, a saturated flash) flatten
   everything else into a line. */
function limits(vals) {
  if (!vals.length) return [0, 1];
  const a = Float64Array.from(vals).sort();
  const lo = a[Math.floor(0.01 * (a.length - 1))], hi = a[Math.ceil(0.99 * (a.length - 1))];

let lastAuto = null;
/* The boxes show the limits in force: typed ones in accent, auto ones greyed as placeholders
   (in stack mode, those of the selected band). Typing fixes them for every band and the
   overlay, across time zooms, until 'auto'. */
function syncYBoxes() {
  const lo = $("yLo"), hi = $("yHi"), fixed = !!V.yFixed;
  lo.classList.toggle("fixed", fixed); hi.classList.toggle("fixed", fixed);
  if (fixed) { if (document.activeElement !== lo) lo.value = V.yFixed[0]; if (document.activeElement !== hi) hi.value = V.yFixed[1]; }
  else { lo.value = ""; hi.value = ""; lo.placeholder = lastAuto ? lastAuto[0].toFixed(0) : "auto"; hi.placeholder = lastAuto ? lastAuto[1].toFixed(0) : "auto"; }
  $("yAuto").disabled = !fixed;
}
function applyY() {
  const lo = parseFloat($("yLo").value), hi = parseFloat($("yHi").value);
  if (!isFinite(lo) && !isFinite(hi)) { V.yFixed = null; }
  else {
    const base = V.yFixed || lastAuto || [0, 1];
    const a = isFinite(lo) ? lo : base[0], b = isFinite(hi) ? hi : base[1];
    if (b <= a) { badge("y: high must be above low", true); setTimeout(() => badge("saved"), 1500); syncYBoxes(); return; }
    V.yFixed = [a, b];
  }
  plotTraces(); saveView();
}
["yLo", "yHi"].forEach(id => { $(id).onchange = applyY; $(id).onkeydown = e => { e.stopPropagation(); if (e.key === "Enter") { applyY(); $(id).blur(); } }; });
$("yAuto").onclick = () => { V.yFixed = null; plotTraces(); saveView(); };
function niceStep(raw) { if (raw <= 0) return 1; const p = Math.pow(10, Math.floor(Math.log10(raw))); const m = raw / p; return (m < 1.5 ? 1 : m < 3.5 ? 2 : m < 7.5 ? 5 : 10) * p; }

/* zoom in time by dragging a span; wheel around the cursor; ⤢ resets; click moves the frame */
/* A visible box, like the image's. In stack mode it zooms time; in overlay it zooms time AND
   value, because there the y axis is shared and means something. */
let tdown = null;
const TL = 54, TR_ = 12, TT = 18, TB = 18;
const traceFrame = ev => {
  const r = $("trace").getBoundingClientRect(), W = $("traceScroll").clientWidth;
  const n = TR ? TR.traces[0].length : 1, [t0, t1] = V.traceZoom || [0, n - 1];
  return Math.round(t0 + (ev.clientX - r.left - TL) / (W - TL - TR_) * (t1 - t0));
};
const traceValue = ev => {                          // overlay only
  const r = $("trace").getBoundingClientRect(), H = +$("trace").style.height.replace("px", "") || $("traceScroll").clientHeight;
  const ts = visibleTraces(), n = TR.traces[0].length, [t0, t1] = V.traceZoom || [0, n - 1];
  const all = ts.flatMap(t => t.v.slice(t0, t1 + 1)); const [lo, hi] = V.yFixed || V.valueZoom || limits(all);
  return lo + (1 - (ev.clientY - r.top - TT) / (H - TT - TB)) * (hi - lo);
};
$("trace").addEventListener("mousemove", ev => {
  const rd = $("traceRead");
  if (!TR) { rd.style.display = "none"; return; }
  const ts = visibleTraces(); if (!ts.length) { rd.style.display = "none"; return; }
  const n = TR.traces[0].length, f = Math.max(0, Math.min(n - 1, traceFrame(ev)));
  let t;
  if (V.traceMode === "stack") {                       // the band under the cursor
    const r = $("trace").getBoundingClientRect(), row = Math.floor((ev.clientY - r.top - TT) / 64);
    t = ts[Math.max(0, Math.min(ts.length - 1, row))];
  } else {                                             // the trace nearest the cursor in value, the selected one on a tie
    const v = traceValue(ev);
    t = ts.slice().sort((a, b) => Math.abs(a.v[f] - v) - Math.abs(b.v[f] - v) || (a.i === V.sel ? -1 : 0))[0];
  }
  rd.style.display = "block";
  rd.innerHTML = `<span style="color:${colour(t.i)}">${esc(t.name)}</span> · frame ${f}` + (fs() ? ` · ${(f / fs()).toFixed(2)} s` : "") + ` · <b>${t.v[f]}</b>`;
});
$("trace").addEventListener("mouseleave", () => { $("traceRead").style.display = "none"; });
$("trace").onmousedown = ev => { if (TR && ev.button === 0) tdown = { x: ev.clientX, y: ev.clientY, f: traceFrame(ev), v: V.traceMode === "overlay" ? traceValue(ev) : null, moved: false }; };
$("trace").onmousemove = ev => {
  if (!tdown) return;
  if (!tdown.moved && Math.abs(ev.clientX - tdown.x) <= 4) return;
  tdown.moved = true;
  const box = $("traceScroll").getBoundingClientRect(), rb = $("traceRubber"), ov = V.traceMode === "overlay";
  rb.style.display = "block";
  rb.style.left = Math.min(ev.clientX, tdown.x) - box.left + "px"; rb.style.width = Math.abs(ev.clientX - tdown.x) + "px";
  if (ov) { rb.style.top = Math.min(ev.clientY, tdown.y) - box.top + $("traceScroll").scrollTop + "px"; rb.style.height = Math.abs(ev.clientY - tdown.y) + "px"; }
  else { rb.style.top = TT + "px"; rb.style.height = ($("traceScroll").scrollHeight - TT - TB) + "px"; }
};
window.addEventListener("mouseup", ev => {
  if (!tdown) return; const d = tdown; tdown = null; $("traceRubber").style.display = "none"; if (!TR) return;
  const n = TR.traces[0].length, f = Math.max(0, Math.min(n - 1, traceFrame(ev)));
  if (d.moved) {
    const a = Math.max(0, Math.min(d.f, f)), b = Math.min(n - 1, Math.max(d.f, f)); if (b - a >= 4) V.traceZoom = [a, b];
    V.valueZoom = null;                                            // a box in overlay sets the value range too; any other change lets it adapt
    if (d.v != null && Math.abs(ev.clientY - d.y) > 6) { const v2 = traceValue(ev); V.valueZoom = [Math.min(d.v, v2), Math.max(d.v, v2)]; }
  } else {
    clearTimeout(pendingTraceClick);
    pendingTraceClick = setTimeout(() => { pendingTraceClick = 0; V.frame = f; $("frame").value = f; V.mean = false;
      $("meanBtn").classList.remove("on"); draw(); plotTraces(); saveView(); }, 230);
    return;
  }
  plotTraces(); saveView();
});
/* Double-click on the traces: home. Same gesture as on the image, same rule about the two
   clicks that precede it. */
let pendingTraceClick = 0;
$("trace").ondblclick = () => { clearTimeout(pendingTraceClick); pendingTraceClick = 0; V.traceZoom = null; V.valueZoom = null; plotTraces(); saveView(); };
$("trace").onwheel = ev => {
  if (!TR) return; ev.preventDefault();
  const n = TR.traces[0].length, [t0, t1] = V.traceZoom || [0, n - 1], c = traceFrame(ev), f = ev.deltaY < 0 ? 0.8 : 1.25;
  let span = Math.min(n - 1, Math.max(8, (t1 - t0) * f)), a = Math.round(c - (c - t0) * span / (t1 - t0));
  a = Math.max(0, Math.min(n - 1 - span, a));
  V.traceZoom = span >= n - 1 ? null : [a, Math.round(a + span)]; V.valueZoom = null; plotTraces(); saveView();
};
$("traceReset").onclick = () => { V.traceZoom = null; V.valueZoom = null; plotTraces(); saveView(); };
$("modeStack").onclick = () => { V.traceMode = "stack"; V.valueZoom = null; applyStatic(); plotTraces(); saveView(); };
$("modeOverlay").onclick = () => { V.traceMode = "overlay"; applyStatic(); plotTraces(); saveView(); };
$("gridBtn").onclick = () => { V.grid = !V.grid; applyStatic(); plotTraces(); saveView(); };

/* the strip's height, dragged */
/* Two splitters, the same way: the trace strip from its top edge, the metadata panel from
   its top edge. Both heights are remembered with the view. */
let sdown = null;
$("splitter").onmousedown = ev => { sdown = { which: "traces", y: ev.clientY, h: V.tracesH }; ev.preventDefault(); };
$("metaSplit").onmousedown = ev => { sdown = { which: "meta", y: ev.clientY, h: V.metaH }; ev.preventDefault(); };
window.addEventListener("mousemove", ev => {
  if (!sdown) return;
  const h = sdown.h + (sdown.y - ev.clientY);
  if (sdown.which === "traces") V.tracesH = Math.max(120, Math.min(window.innerHeight * .7, h));
  else V.metaH = Math.max(60, Math.min($("unitsCol").clientHeight - 140, h));
  applyStatic();
});
window.addEventListener("mouseup", () => { if (sdown) { sdown = null; plotTraces(); saveView(); } });

boot();
</script>
