name: tests

on:
  push:
  pull_request:
  workflow_dispatch:      # a button, for when a green run is wanted without a change

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Every version pyproject claims (and the README badge shows), on the three platforms.
        # A claim about supported versions that nothing checks is a guess.
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        # ubuntu-latest became 26.04 (2026-11), and setup-python has no 3.9 for it: 3.9 on Linux
        # runs on 24.04 instead, so the claim stays checked rather than silently dropped.
        exclude:
          - os: ubuntu-latest
            python-version: "3.9"
        include:
          - os: ubuntu-24.04
            python-version: "3.9"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install ".[tiff,dev]"
      - name: Test the installed package, from outside the checkout
        # Not the working tree: this is what a user gets, and a packaging mistake must fail
        # here rather than hide behind a source import.
        working-directory: ${{ runner.temp }}
        run: python -m pytest ${{ github.workspace }}/tests -q
      - name: The console command exists
        run: mesc-io --version

  # Suite2p is a heavy optional extra, so it gets one job rather than the whole matrix.
  # Without it the registration tests skip, and a skipped test proves nothing.
  register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ".[tiff,register,dev]"
      - working-directory: ${{ runner.temp }}
        run: python -m pytest ${{ github.workspace }}/tests -q

  # The viewer's real-Chrome checks (tools/run_browser_checks.sh): the page is JavaScript that
  # pytest never runs, and these checks sat red for days with nobody running them by hand.
  # macOS: the checks were written and tuned there (fonts, device pixels, headless window size) and
  # it is where the viewer is used; on Ubuntu 4 of 10 failed on 1-2 px layout differences (17 Nov).
  browser:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: browser-actions/setup-chrome@v1
        id: chrome
      - run: pip install ".[tiff]"
      - name: Real-browser checks
        env:
          CHROME: ${{ steps.chrome.outputs.chrome-path }}
        run: tools/run_browser_checks.sh
