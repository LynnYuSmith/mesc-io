# Publish to PyPI on a version tag, through Trusted Publishing — no token anywhere.
#
# One-time setup on pypi.org (and test.pypi.org): the project's "Publishing" page → add a
# GitHub publisher: owner LynnYuSmith, repository mesc-io, workflow release.yml, environment
# pypi (or testpypi). After that: `git tag v0.1.1 && git push --tags` publishes.
#
#   tag v*         → build, then the test suite must be green, then TestPyPI, then PyPI
#   workflow_dispatch → build + TestPyPI only (a rehearsal that cannot burn a real version)
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          pip install build
          python -m build
      - name: The wheel installs and works, from a clean environment
        run: |
          python -m venv /tmp/clean && /tmp/clean/bin/pip install dist/*.whl
          /tmp/clean/bin/mesc-io --version
          /tmp/clean/bin/python -c "import mesc_io, importlib.resources as r; assert r.files('mesc_io').joinpath('viewer.html').is_file(), 'the page is not in the wheel'"
      - name: The tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v=$(/tmp/clean/bin/python -c "import mesc_io; print(mesc_io.__version__)")
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} but the package says $v"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  testpypi:
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  pypi:
    needs: testpypi
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
