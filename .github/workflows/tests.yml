name: tests

on:
  push:
  pull_request:
  workflow_dispatch:      # a button, for when a green run is wanted without a change

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The floor and the ceiling of what pyproject claims, plus one in the middle, on the
        # three platforms. A claim about supported versions that nothing checks is a guess.
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install ".[tiff,dev]"
      - name: Test the installed package, from outside the checkout
        # Not the working tree: this is what a user gets, and a packaging mistake must fail
        # here rather than hide behind a source import.
        working-directory: ${{ runner.temp }}
        run: python -m pytest ${{ github.workspace }}/tests -q
      - name: The console command exists
        run: mesc-io --version

  # Suite2p is a heavy optional extra, so it gets one job rather than the whole matrix.
  # Without it the registration tests skip, and a skipped test proves nothing.
  register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ".[tiff,register,dev]"
      - working-directory: ${{ runner.temp }}
        run: python -m pytest ${{ github.workspace }}/tests -q
