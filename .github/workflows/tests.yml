name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The floor and the ceiling of what pyproject claims, plus one in the middle, on the
        # three platforms. A claim about supported versions that nothing checks is a guess.
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install ".[tiff,dev]"
      - name: Test from a directory that is not the checkout
        # installed-package tests, not source-tree tests: this is what a user gets
        run: |
          mkdir -p ../elsewhere
          cd ../elsewhere
          python -m pytest ../mesc_io/tests -q
      - name: The console command exists
        run: mesc-io --version
