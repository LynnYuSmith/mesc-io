# Publish to PyPI on a version tag, through Trusted Publishing — no token anywhere.
#
# One-time setup on pypi.org: the project's "Publishing" page → a GitHub publisher: owner
# LynnYuSmith, repository mesc-io, workflow release.yml. After that: `git tag v0.1.1 && git
# push --tags` publishes. A version on PyPI is forever — the build job checks the wheel in a
# clean environment first, and the tag must equal the package's own version.
#
#   tag v*            → build + checks, then PyPI
#   workflow_dispatch → build + checks only (a rehearsal)
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          pip install build
          python -m build
      - name: The wheel installs and works, from a clean environment
        run: |
          python -m venv /tmp/clean && /tmp/clean/bin/pip install dist/*.whl
          /tmp/clean/bin/mesc-io --version
          /tmp/clean/bin/python -c "import mesc_io, importlib.resources as r; assert r.files('mesc_io').joinpath('viewer.html').is_file(), 'the page is not in the wheel'"
      - name: The tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v=$(/tmp/clean/bin/python -c "import mesc_io; print(mesc_io.__version__)")
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} but the package says $v"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # a tag pushed again (a history rewrite, a re-run) must not go red on a version
          # PyPI already holds; a NEW version is still refused if its files differ
          skip-existing: true

  # The tag alone left the Releases page empty through four versions: PyPI had them, GitHub
  # showed nothing, and someone arriving at the repo had no list of what changed when. The
  # notes are the CHANGELOG's own section for this version rather than a second telling of it.
  github_release:
    needs: [build, pypi]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: The CHANGELOG section for this version
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '
            $0 ~ "^## " v " " { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "See CHANGELOG.md." > notes.md
          cat notes.md
      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: notes.md
          files: dist/*
